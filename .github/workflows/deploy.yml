name: Deploy to Home Server

# CI(check / secret-scan)が main で成功したコミットだけをデプロイする。
on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]

# デプロイは直列に。実行中のものは止めず、次を待たせる。
concurrency:
  group: deploy
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  deploy:
    if: ${{ github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'push' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ap-northeast-1

      # CIを通ったコミットそのものをデプロイする(workflow_run は最新の main を指さない)。
      - name: Create CodeDeploy Deployment
        run: |
          aws deploy create-deployment \
            --application-name PortfolioApp \
            --deployment-group-name Portfolio-DG \
            --github-location repository=${{ github.repository }},commitId=${{ github.event.workflow_run.head_sha }}

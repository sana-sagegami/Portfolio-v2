version: 2
updates:
  - package-ecosystem: npm
    directory: /bysana
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      # 毎週PRが散らばらないよう、マイナー/パッチはまとめる。
      minor-and-patch:
        update-types: [minor, patch]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
